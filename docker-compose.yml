# docker-compose.yml
services:
  qa-container:
    image: ghcr.io/adamoutler/gemini-playwright-qa:latest
    env_file:
      - .env
    volumes: 
      - ~/.gemini:/root/.gemini:rw
      - /etc/localtime:/etc/localtime:ro
      - ./persona.md:/app/persona.md:ro
      - ./selected-journeys.txt:/app/selected-journeys.txt:ro
      - ./runner.py:/app/runner.py:ro
      
      # Security: Mount only the selected journeys and settings
      - ./container_journeys:/app/journeys:ro
      - ./.gemini_project:/app/project/.gemini:ro
    tmpfs:
      - /app/project:rw,mode=777
